<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" />
    <title>Flarent Pulse — Turn your business into a growth plan.</title>
    <meta
      name="description"
      content="Tell us about your business. Flarent Pulse turns it into practical marketing ideas, content and campaigns you can actually use."
    />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <!--
      Netlify detects forms by parsing the deployed HTML at build time, and a
      React-rendered form is invisible to that parser. This hidden copy is the
      declaration: it registers the form and its fields. The real submission is
      an encoded POST from src/components/feedback-form.tsx, and the field names
      below must stay in step with it.
    -->
    <form name="pulse-feedback" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="pulse-feedback" />
      <input type="text" name="bot-field" />
      <input type="text" name="rating" />
      <textarea name="comment"></textarea>
      <input type="text" name="generation_id" />
      <input type="text" name="business_name" />
      <input type="text" name="industry" />
      <input type="text" name="location" />
      <input type="text" name="page" />
    </form>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
